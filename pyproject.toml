[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rawbert"
version = "0.1.0"
description = "Custom BERT implementation with Flash Attention and Triton components"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Ryan Synk", email = "ryansynk@umd.edu"}
]

# Essential dependencies based on your file names
dependencies = [
    "torch",
    "transformers",  # Likely needed for tokenizers or config
    "einops",        # Common in custom modeling code
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]

# CRITICAL for your directory structure
# This explicitly tells setuptools to look for the 'rawbert' directory
[tool.setuptools.packages.find]
include = ["rawbert*"]
exclude = ["training*", "tests*"]