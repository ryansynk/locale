[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lae"
version = "0.1.0"
description = "Custom BERT implementation with Flash Attention and Triton components"
readme = "README.md"
# The base install is not tied to a single interpreter. The `flash` extra is:
# its wheel is cp311-only, so `uv sync --extra flash` requires Python 3.11.
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Ryan Synk", email = "ryansynk@umd.edu"}
]

dependencies = [
    "torch>=2.6",
    "transformers<=4.57.1",
    "einops",
    "biopython",
    "edlib",
    "huggingface-hub",
    "jsonargparse",
    "matplotlib",
    "numpy",
    "polars",
    "pyarrow",
    "tqdm",
    "wandb",
    "pyyaml",
    "zstandard",
    "metagraph-api",
    "setuptools>=82.0.1",
    # GPU ANN (CAGRA) for DenseIndex.use_ann, replacing diskannpy. The CUDA major
    # version is baked into the package name; -cu12 matches the cu124 torch index
    # below. Wheels are manylinux x86_64/aarch64 only.
    #
    # Capped below 26.4: from 26.4 on, libcuvs-cu12 requires nvidia-nvjitlink-cu12
    # >=12.9, while torch 2.6.0+cu124 pins it to ==12.4.127 -- unresolvable together.
    # Moving to a newer cuvs means moving torch to a cu129 build first, which also
    # means a new flash-attn wheel.
    "cuvs-cu12>=26.2,<26.4",
    # Transitive (cuvs -> libcuvs), listed only so the nvidia index below applies to
    # it: uv sources bind to direct dependencies, and this is the other half of the
    # pair RAPIDS has not published as a PyPI wheel at 26.2.
    "libcuvs-cu12>=26.2,<26.4",
    "scikit-learn>=1.8.0",
    "boto3>=1.43.9",
]

[project.optional-dependencies]
# flash-attn is distributed as a prebuilt wheel tied to one exact
# python/torch/CUDA/C++-ABI combination. Keeping it out of the base
# dependencies is what lets this project install on any of them; without it
# `patch_with_flash_lib` is a no-op and attention falls back to the model's
# native ALiBi path, which is slower but still correct.
flash = [
    "flash-attn==2.7.4.post1+cu12torch2.6cxx11abiFALSE",
]
# Only needed for the Evo2 baseline in benchmark/src/dense_index.py, which
# imports it lazily and errors with an install hint if it is missing.
evo2 = [
    "evo2>=0.5.5",
]
dev = [
    "pytest",
    "black",
    "ruff",
    "ipython>=9.10.0",
    "ipdb>=0.13.13",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# RAPIDS ships only sdists to PyPI for every cuvs release that predates 26.6, and
# building cuvs from source needs the full CUDA toolchain. The wheels live here.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
metagraph-api = { git = "https://github.com/ratschlab/metagraph.git", subdirectory = "metagraph/api/python" }
torch = { index = "pytorch"}
cuvs-cu12 = { index = "nvidia" }
libcuvs-cu12 = { index = "nvidia" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }
[tool.setuptools.packages.find]
include = ["lae*"]
exclude = ["training*", "tests*"]
