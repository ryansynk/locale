[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rawbert"
version = "0.1.0"
description = "Custom BERT implementation with Flash Attention and Triton components"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
  {name = "Ryan Synk", email = "ryansynk@umd.edu"}
]

dependencies = [
    "torch==2.5.1",
    "transformers",
    "einops",
    "altair",
    "biopython",
    "edlib",
    "jsonargparse",
    "numpy",
    "polars",
    "pyarrow",
    "sourmash",
    "tqdm",
    "wandb",
    "pyyaml",
    "zstandard",
    "flash-attn==2.8.0.post2+cu12torch2.5cxx11abiFALSE",
    "ipython>=9.10.0",
    "ipdb>=0.13.13",
    "pyfaidx>=0.9.0.3",
    "vl-convert-python>=1.9.0.post1",
    "metagraph-api",
    "evo2>=0.5.5",
    "setuptools>=82.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "ipython"
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
metagraph-api = { git = "https://github.com/ratschlab/metagraph.git", subdirectory = "metagraph/api/python" }
torch = { index = "pytorch"}
flash-attn = {url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.0.post2/flash_attn-2.8.0.post2+cu12torch2.5cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }

# CRITICAL for your directory structure
# This explicitly tells setuptools to look for the 'rawbert' directory
[tool.setuptools.packages.find]
include = ["rawbert*"]
exclude = ["training*", "tests*"]
