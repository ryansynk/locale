[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rawbert"
version = "0.1.0"
description = "Custom BERT implementation with Flash Attention and Triton components"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
  {name = "Ryan Synk", email = "ryansynk@umd.edu"}
]

dependencies = [
    "torch",
    "transformers",
    "einops",
    "altair",
    "biopython",
    "edlib",
    "jsonargparse",
    "numpy",
    "polars",
    "pyarrow",
    "sourmash",
    "tqdm",
    "wandb",
    "pyyaml",
    "zstandard",
    "flash-attn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "ipython"
]

[tool.uv.sources]
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.7.4+cu128torch2.10-cp311-cp311-linux_x86_64.whl" }

# CRITICAL for your directory structure
# This explicitly tells setuptools to look for the 'rawbert' directory
[tool.setuptools.packages.find]
include = ["rawbert*"]
exclude = ["training*", "tests*"]