# Negative queries (sra500_negatives2k: 2000 reads from sra4571 runs whose
# organism never occurs in sra500 and that align to no sra500 accession at
# >= 90% identity) searched against the sra500 index with the encoder/search
# settings of configs/sra500/perlmutter_locale_l6e9itq9_w128_sra500v2.yaml
# (128 bp / stride 64 / endwin30 / minlen100, projection head, exact top-100,
# both strands). index_dir is the sra500 index dir, so the built index is
# reused as is (index identity is the encoder config); only dataset_dir and
# results_dir differ. Calibrated-FPR experiment: scripts/calibrate_fpr.py.
#
#   cd /pscratch/sd/r/rsynk/locale/benchmark
#   srun --unbuffered --ntasks-per-node=1 --gpus-per-node=4 --cpus-per-task=128 \
#     bash -c 'exec "$@" --shard "$SLURM_NODEID" --num_shards "$SLURM_NNODES"' _ \
#     uv run python scripts/run_benchmark.py \
#       --config configs/sra500_negatives2k/perlmutter_locale_l6e9itq9_w128_sra500neg2k.yaml \
#       --mutation_rate 0.0
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/l6e9itq9/checkpoint21380.pth.tar
    pooling: mean
    max_seq_len: 128
    chunk_overlap: 64
    end_window_min_tail_bp: 30
    min_seq_len: 100
    project: true
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: locale@l6e9itq9-proj-w128s64-endwin30-minlen100
  index_label: exact
  search_label: top100

dataset_name: sra500neg2k
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500_negatives2k/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500_negatives2k
mutation_rate: 0.0
