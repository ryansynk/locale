# indexes/sra500/metagraph/ (.done). Calibrated-FPR experiment.
#   CONFIG=configs/sra500_negatives2k/perlmutter_metagraph_sra500neg2k.yaml \
#     sbatch slurm_scripts/perlmutter_sra500neg_metagraph.sbatch
model:
  name: metagraph
  executable: shifter metagraph
  k: 31
  label: metagraph
  search_label: default

dataset_name: sra500neg2k
