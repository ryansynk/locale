model:
  name: locale                   # locale | dnabert | metagraph | mmseqs | mantis | dna2vec
  # null downloads the checkpoint published with the paper (see PAPER_CHECKPOINT
  # in src/config.py), which reproduces the paper's index paths exactly. Set a
  # local .pth.tar path to benchmark your own run instead.
  checkpoint_path: null
  batch_size: 1000               # embedding batch size
  device: cuda                   # cuda | cpu
  pooling: mean                  # mean | max | cls
  max_seq_len: 256               # max tokens per chunk
  chunk_overlap: 150             # overlap between stride chunks

dataset_name: sra50
dataset_dir: null                # where to materialise the HF dataset; null = default HF cache
index_dir: indexes_50
results_dir: results_50
mutation_rate: 0.0               # synthetic mutation rate applied to queries
