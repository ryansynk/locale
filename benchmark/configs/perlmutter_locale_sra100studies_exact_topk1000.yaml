# Top-k-vectors-then-regroup variant of perlmutter_locale_sra100studies.yaml.
#
# Identical encoder/index settings (same index_suffix, so it reads the merged
# index that the full-dense baseline built and scanned) but scores each query
# by its exact global top-1000 nearest index VECTORS regrouped to accessions
# by max score, instead of the max over every accession's vectors. This is the
# ranking an ANN index accelerates, so matching the baseline here is what
# licenses switching the 100-studies search to ANN.
#
# exact_search flips experiment_id to ..._exacttop1000, so results land in
# results_100studies/<experiment_id>_exacttop1000/ beside -- never over -- the
# full-dense baseline. The raw per-query top-1000 hits go to
# results_100studies_topk_hits/ (config default topk_hits_dir), from which
# rescore_topk.py derives k = 10/20/50/100/200 without rescanning.
#
# Launch: sbatch perlmutter_100studies_search.sbatch <rate> \
#             configs/perlmutter_locale_sra100studies_exact_topk1000.yaml
model:
  name: locale
  checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
  batch_size: 1000
  device: cuda
  pooling: mean
  max_seq_len: 256
  chunk_overlap: 150
  exact_search: true
  top_k: 1000

dataset_name: sra100studies
dataset_dir: /pscratch/sd/r/rsynk/locale-data/100studies_work/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes_100studies
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results_100studies
mutation_rate: 0.0
num_queries: 1000
