# Metagraph (k-mer) on the cross-genotype HBV benchmark (sra52viral).
#
# This is the baseline the benchmark is built to stress. At ~11% divergence only
# 49.2% of query reads share ANY exact 31-mer with the target genotype, so
# metagraph returns an empty result set for roughly half the queries and cannot
# score them at all. k stays at 31 deliberately: smaller k restores overlap but
# destroys specificity at SRA scale (a 15-mer has ~1e3 chance occurrences in a
# 1e12-base corpus), so there is no k that escapes both problems.
#
# See nexus_locale_sra52viral.yaml for why the dirs must be fresh.
model:
  name: metagraph
  # No working native build on Nexus; run the published image under apptainer.
  # See nexus_metagraph.yaml for why the binds are self-referential.
  executable: >-
    apptainer exec
    --bind /fs/nexus-projects/sra_search:/fs/nexus-projects/sra_search
    --bind /fs/nexus-scratch/ryansynk:/fs/nexus-scratch/ryansynk
    /fs/nexus-scratch/ryansynk/metagraph_master.sif
    metagraph
  k: 31

dataset_name: sra52viral
dataset_dir: /fs/nexus-projects/sra_search/hf/sra52viral
index_dir: /fs/nexus-projects/sra_search/indexes_sra52viral
results_dir: /fs/nexus-scratch/ryansynk/rawbert/benchmark/results_sra52viral
mutation_rate: 0.0
num_queries: 500
