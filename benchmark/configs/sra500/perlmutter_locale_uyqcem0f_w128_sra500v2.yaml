# LOCALE uyqcem0f/4276 (1-epoch run, projection head) on sra500v2 with the
# 128 bp / stride-64 / endwin30 / minlen100 index settings of
# perlmutter_locale_pc6t1x8j_w128_sra500v2.yaml (exact top-100, both strands).
#   cd benchmark && ./run_sra500.sh locale_uyqcem0f_w128
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/uyqcem0f/checkpoint4276.pth.tar
    pooling: mean
    max_seq_len: 128
    chunk_overlap: 64
    end_window_min_tail_bp: 30
    min_seq_len: 100
    project: true
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: locale@uyqcem0f-proj-w128s64-endwin30-minlen100
  index_label: exact
  search_label: top100

dataset_name: sra500v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500
mutation_rate: 0.0
