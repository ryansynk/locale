# top_k 300 variant of perlmutter_locale_sra500v2.yaml (same index, search only): tests whether the
# sra500 epsilon-net recall loss is the top-100 cutoff (2026-10-01).
# LOCALE on sra500v2 (the 2026-09 rebuild of the 500-accession benchmark).
#
# Default top-k regroup protocol at k=100 with both-strand querying: q and its
# reverse complement are embedded, the two top-100 hit lists unioned, hits
# regrouped to accessions by max. results land in
# results/sra500/<encoder_label>/exact/top100/ and the raw hits in its hits/
# subdirectory, reused by any later run at k <= 100.
#
# Paper checkpoint (8vqiabk9/5859), encoder settings as in the sra4571 runs.
# Layout: indexes/<dataset>/<encoder_label>/[<index_label>/],
# results/<dataset>/<encoder_label>/<index_label>/<search_label>/.
# Multi-node: the build shards accessions and the search shards vector rows
# across the nodes of the job (run through srun, one task per node).
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 300
  encoder_label: locale@8vqiabk9
  index_label: exact
  search_label: top300

# Local bundle (locale-data list-first pipeline, built 2026-09-21; the source
# of the HF sra500-v2 upload): 500 accessions disjoint from train/val, 500
# raw-read queries from 228 runs, both strands aligned (strand column: 245 +,
# 255 -), per-rate query files queries_mut0.00/0.05/0.10.parquet.
# logan_accessions/ is a per-accession directory of symlinks into
# ../work/logan_contigs, laid out by the same loop as
# slurm_scripts/perlmutter_sra4571.sbatch.
dataset_name: sra500v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500
mutation_rate: 0.0
