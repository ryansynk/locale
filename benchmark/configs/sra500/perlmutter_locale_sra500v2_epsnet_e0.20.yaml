# LOCALE on sra500v2, epsilon-net index (src/epsilonnet.py): one greedy net per
# accession (every vector within cosine similarity 1 - epsilon of a center),
# built one thread per GPU; the centers are written as their own
# embeddings.fbin and searched by the exact top-k scan across the node's GPUs.
# One of the sra500 epsilon sweep 0.20 / 0.25 / 0.30 / 0.40 (configs differ
# only in epsilon and index_label). Reuses indexes/sra500/locale@8vqiabk9/.
#   bash slurm_scripts/epsnet_sweep.sh configs/sra500/perlmutter_locale_sra500v2_epsnet_e*.yaml
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: epsilonnet
    epsilon: 0.2
    top_k: 100
  encoder_label: locale@8vqiabk9
  index_label: epsnet-e0.20
  search_label: top100

dataset_name: sra500v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500
mutation_rate: 0.0
