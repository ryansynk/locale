# LOCALE on sra500v2 with checkpoint pxve4g5o/9765 (DNABERT-2, no projection
# head, reference_nohm training set = reference genomes without human/mouse,
# hard negatives, 1 epoch / 6 M samples), WITHOUT the 100 bp contig cutoff:
# every contig is embedded. Otherwise identical to
# perlmutter_locale_pxve4g5o_sra500v2.yaml: 256 bp windows at the original
# stride (chunk_overlap 150 -> step 106), end-aligned tail window
# (end_window_min_tail_bp 50), exact top-100, both strands, 768-d pooled
# vectors. Same protocol as locale@8vqiabk9-endwin50, the comparison row
# (results/sra500/locale@8vqiabk9-endwin50/exact/top100/). The index is a
# separate ~2x larger build (the cutoff halves the vector count), roughly
# 450 GB fp32 under indexes/sra500/locale@pxve4g5o-endwin50/.
#
#   salloc -A m5408_g -C gpu -q interactive -N 4 -t 4:00:00 \
#          --ntasks-per-node=1 --gpus-per-node=4 -c 128
#   cd benchmark && ./run_sra500.sh locale_pxve4g5o_nocutoff
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/pxve4g5o/checkpoint9765.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    end_window_min_tail_bp: 50
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: locale@pxve4g5o-endwin50
  index_label: exact
  search_label: top100

dataset_name: sra500v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500
mutation_rate: 0.0
