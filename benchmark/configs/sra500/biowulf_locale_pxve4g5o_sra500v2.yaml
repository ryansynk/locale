# Biowulf run of checkpoint pxve4g5o/9765 (DNABERT-2, no projection head,
# reference_nohm training set = reference genomes without human/mouse, hard
# negatives, 1 epoch / 6 M samples, as-trained identity 90.9/100/6.8; final
# checkpoint of the run, trained on Biowulf) on sra500v2.
#
# Protocol is the paper benchmark of perlmutter_locale_sra500v2.yaml
# (8vqiabk9/5859) with only the checkpoint swapped: 256 bp windows at the
# baseline stride (chunk_overlap 150 -> step 106), no end-aligned tail window,
# no contig-length cutoff, exact top-100, both strands. project is left off
# because the checkpoint has no projector (use_projection_head: false), so the
# index holds 768-d pooled vectors like locale@8vqiabk9. Compare against
# results/sra500/locale@8vqiabk9/exact/top100/ (Perlmutter) or the
# perlmutter_locale_yxocdyka_sra500v2.yaml run, which uses the same protocol.
# (perlmutter_locale_pxve4g5o_sra500v2.yaml is the endwin50/minlen100 variant
# of this checkpoint; different encoder identity, different index.)
#
# Biowulf specifics (see biowulf_locale_4svch81s_w128_sra500v2.yaml):
#   - contigs, checkpoint, index and results live under /data/synkrp
#   - batch_size 4000 per GPU worker: the Perlmutter value of 1000 was sized
#     for 40 GB A100s; these are 141 GB H200s. batch_size is not part of the
#     index identity. (The 2026-11-08 attempt used 8000 and reached 45 % of
#     the embed before dying without a traceback; 4000 is plenty to saturate
#     an H200 and leaves host RAM headroom.)
#   - ~153 M windows (counted 2026-11-08) -> ~470 GB fp32 embeddings.fbin;
#     embed is ~70 min on 8 H200s, each exact scan streams the fbin once.
# Biowulf has no multi-node GPU jobs, so this runs as one 8x H200 node with
# --num_shards 1 (whole index built in one process, one embedding worker per
# GPU, exact scan across all 8 GPUs):
#   CONFIG=configs/sra500/biowulf_locale_pxve4g5o_sra500v2.yaml \
#       sbatch slurm_scripts/biowulf_sra500.sbatch
model:
  encoder:
    name: locale
    checkpoint_path: /data/synkrp/locale/checkpoints/pxve4g5o/checkpoint9765.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 4000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: locale@pxve4g5o
  index_label: exact
  search_label: top100

dataset_name: sra500v2
dataset_dir: /data/synkrp/locale-data/constructed/sra500/bundle
index_dir: /data/synkrp/locale/benchmark/indexes/sra500
results_dir: /data/synkrp/locale/benchmark/results/sra500
mutation_rate: 0.0
