# LOCALE on sra500v2, random-subsample baseline for the sra500 epsilon-net
# sweep (src/random_sample.py): each accession keeps a uniform random
# round(n / compression_ratio) of its n vectors (min 1), written as their own
# embeddings.fbin and searched by the exact top-k scan -- the same engine as
# the epsilon net, only the row choice differs. compression_ratio 1.6139
# matches epsnet-e0.20 (94,856,775 of 153,088,185 vectors kept). Reuses
# indexes/sra500/locale@8vqiabk9/.
#   bash slurm_scripts/epsnet_sweep.sh configs/sra500/perlmutter_locale_sra500v2_randsample_c*.yaml
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: randomsample
    compression_ratio: 1.6139
    seed: 0
    top_k: 100
  encoder_label: locale@8vqiabk9
  index_label: randsample-c1.6139
  search_label: top100

dataset_name: sra500v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500
mutation_rate: 0.0
