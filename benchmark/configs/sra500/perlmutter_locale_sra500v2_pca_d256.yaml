# LOCALE on sra500v2, PCA baseline for the scaling roadmap (src/pca.py): every
# encoder vector projected 768 -> 256 onto the top eigenvectors of a
# per-accession-balanced 100k-row sample's second moment, then the same exact
# top-k scan over the projected fbin. Reuses indexes/sra500/locale@8vqiabk9/
# (153M vectors); the projected fbin is 153M x 256 fp32.
#   bash slurm_scripts/pca_sweep.sh sra500
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: pca
    pca_dim: 256
    top_k: 100
  encoder_label: locale@8vqiabk9
  index_label: pca-d256
  search_label: top100

dataset_name: sra500v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500
mutation_rate: 0.0
