# Validation twin of perlmutter_metagraph_sra500v2.yaml for the multi-node
# metagraph path: same bundle and queries, separate index and results
# directories so a 2-node sharded build can be compared against the
# single-node index. slurm_scripts/perlmutter_sra500_metagraph_sharded.sbatch
# runs it and diffs the two result files. Delete both directories after.
model:
  name: metagraph
  executable: shifter metagraph
  k: 31
dataset_name: sra500v2_local
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500_sharded
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500_sharded
mutation_rate: 0.0
