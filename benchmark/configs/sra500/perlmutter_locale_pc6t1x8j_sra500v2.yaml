# LOCALE on sra500v2 with the projection-head checkpoint pc6t1x8j/21380
# (5-epoch multi_epoch run; final checkpoint). Same protocol as
# perlmutter_locale_sra500v2_endwin50_minlen100.yaml (exact top-100, both
# strands, end-aligned window, no contigs under 100 bp); compare with
# results/sra500_minlen/locale@8vqiabk9-endwin50/exact-minlen100/top100/.
#
# project: true embeds through the checkpoint's 768->768->256 projector_q
# before L2 normalization (the space the contrastive loss trained); the index
# holds 256-d vectors. "project" is part of the encoder identity, so this
# index cannot be confused with a pooled-backbone one. Run on an allocation:
#   cd benchmark && ./run_sra500.sh locale_pc6t1x8j
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/pc6t1x8j/checkpoint21380.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    end_window_min_tail_bp: 50
    min_seq_len: 100
    project: true
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: locale@pc6t1x8j-proj-endwin50-minlen100
  index_label: exact
  search_label: top100

dataset_name: sra500v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500
mutation_rate: 0.0
