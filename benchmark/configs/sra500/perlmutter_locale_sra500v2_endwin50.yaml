# LOCALE on sra500v2, re-embedded with an end-aligned window per contig
# (EncoderConfig.end_window_min_tail_bp = 50): contigs longer than 256 bp get
# one extra window, seq[-256:], whenever the strided windows (step 106) leave
# more than 50 bp of the 3' end unembedded. Everything else is identical to
# perlmutter_locale_sra500v2.yaml (exact top-100, both strands), so the two
# results directories compare directly:
#   results/sra500/locale@8vqiabk9/exact/top100/          (no end window)
#   results/sra500/locale@8vqiabk9-endwin50/exact/top100/ (this config)
# The new encoder label gives the re-embedding its own index directory; the
# option is part of the encoder identity, so it cannot land in the old one.
#   bash slurm_scripts/sra500_endwin.sh      (4-node interactive allocation)
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    end_window_min_tail_bp: 50
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: locale@8vqiabk9-endwin50
  index_label: exact
  search_label: top100

dataset_name: sra500v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500
mutation_rate: 0.0
