# LOCALE on sra500v2, PCA 768 -> 128 stored as bf16 (src/pca.py, dtype bf16):
# single-node build of the same index, for slurm_scripts/pca_shard_check.sh to compare against; delete after.
# Reuses indexes/sra500/locale@8vqiabk9/ (153M vectors); the bf16 file is
# 153M x 128 x 2 B = 39 GB.
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: pca
    pca_dim: 128
    dtype: bf16
    top_k: 100
  encoder_label: locale@8vqiabk9
  index_label: pca-d128-bf16-1node
  search_label: top100

dataset_name: sra500v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500
mutation_rate: 0.0
