# LOCALE on sra50v2, PCA 768 -> 128 stored as bf16 (src/pca.py, dtype bf16):
# the bf16 counterpart of perlmutter_locale_sra50v2_pca_d128.yaml (same fit,
# so the same projector), half its bytes: 12x the fp32 encoder fbin.
# Reuses indexes/sra50/locale@8vqiabk9/.
#   bash slurm_scripts/pca_bf16_sweep.sh
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: pca
    pca_dim: 128
    dtype: bf16
    top_k: 100
  encoder_label: locale@8vqiabk9
  index_label: pca-d128-bf16
  search_label: top100

dataset_name: sra50v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra50/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra50
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra50
mutation_rate: 0.0
