# LOCALE on sra50v2, merged epsilon-net index (src/merged_epsilonnet.py): one
# greedy net (cosine >= 1 - epsilon) over every accession's own epsilon net at
# per_accession_epsilon 0.20 (reuses indexes/sra50/locale@8vqiabk9/epsnet-e0.20/),
# so accessions sharing sequence share centers; search returns each query's
# top_k accessions via the center x accession count matrix. One of the merge
# sweep 0.02 / 0.05 / 0.10 / 0.15 / 0.20 (configs differ only in epsilon and
# index_label).
#   bash slurm_scripts/epsnet_sweep.sh configs/sra50/perlmutter_locale_sra50v2_mergednet_l0.20_e*.yaml
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: merged_epsilonnet
    per_accession_epsilon: 0.2
    epsilon: 0.02
    top_k: 100
  encoder_label: locale@8vqiabk9
  index_label: mergednet-l0.20-e0.02
  search_label: top100

dataset_name: sra50v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra50/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra50
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra50
mutation_rate: 0.0
