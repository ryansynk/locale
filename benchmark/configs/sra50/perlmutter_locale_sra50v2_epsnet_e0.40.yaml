# LOCALE on sra50v2, epsilon-net index (src/epsilonnet.py): one greedy net per
# accession, every vector within cosine similarity 1 - epsilon of a center;
# search is an exact top-k scan over the centers only. One of the epsilon
# sweep 0.05 / 0.10 / 0.20 / 0.30 / 0.40 (configs differ only in epsilon and
# index_label). Reuses the exact config's embeddings (indexes/sra50/locale@8vqiabk9/).
#   bash slurm_scripts/epsnet_sweep.sh configs/sra50/perlmutter_locale_sra50v2_epsnet_e*.yaml
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: epsilonnet
    epsilon: 0.4
    top_k: 100
  encoder_label: locale@8vqiabk9
  index_label: epsnet-e0.40
  search_label: top100

dataset_name: sra50v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra50/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra50
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra50
mutation_rate: 0.0
