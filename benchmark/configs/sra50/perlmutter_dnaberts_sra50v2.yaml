# DNABERT-S (zhihan1996/DNABERT-S, downloaded by the encoder; Zhou et al.
# 2024, DNABERT-2 fine-tuned with same-species contrastive pairs for species
# clustering / metagenomic binning) run untrained as a baseline on sra50v2.
# Same protocol as the LLM-ED and paper LOCALE configs: 256 bp windows at
# the original stride (chunk_overlap 150 -> step 106), no end window, no
# contig-length cutoff, mean-pooled 768-d, exact top-100, both strands.
# Compare against results/sra50/llmed/exact/top100/ and
# results/sra50/locale@8vqiabk9/exact/top100/.
#
#   salloc -A m5408_g -C gpu -q interactive -N 1 -t 1:00:00 \
#          --ntasks-per-node=1 --gpus-per-node=4 -c 128
#   cd benchmark && srun --ntasks-per-node=1 --gpus-per-node=4 -c 128 \
#       uv run python scripts/run_benchmark.py --config configs/sra50/perlmutter_dnaberts_sra50v2.yaml --num_shards 1
model:
  encoder:
    name: dnaberts
    checkpoint_path: null
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: dnaberts
  index_label: exact
  search_label: top100

dataset_name: sra50v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra50/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra50
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra50
mutation_rate: 0.0
