# LOCALE on sra50v2, fp16 storage baseline (src/quantized_exact.py): the encoder
# fbin rounded to fp16 (2 bytes/value, 2x smaller), scanned by ExactEngine with
# each block upcast to fp32 on the device, so the rounding is the only
# difference from exact/. Reuses indexes/sra50/locale@8vqiabk9/.
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: quantized_exact
    dtype: fp16
    top_k: 100
  encoder_label: locale@8vqiabk9
  index_label: quantized-fp16
  search_label: top100

dataset_name: sra50v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra50/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra50
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra50
mutation_rate: 0.0
