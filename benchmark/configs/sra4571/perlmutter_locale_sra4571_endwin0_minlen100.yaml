# LOCALE on sra4571, re-embedded with the two chunking fixes of 2026-10:
#   end_window_min_tail_bp: 0   every contig's 3' tail is covered by one
#                               end-aligned window (journal 2026-10-13: T = 0
#                               beats T = 50 by +0.004-0.008 AUPRC on sra500;
#                               the original index covered no tails at all)
#   min_seq_len: 100            contigs shorter than 100 bp are not embedded
#                               (sra500 sweep: keeps ~52% of vectors,
#                               +0.014/+0.025/+0.024 AUPRC at 0/5/10% noise)
# Everything else matches perlmutter_locale_sra4571.yaml. Exact top-100 over
# both strands is the full-precision reference for this encoder; the PCA-128
# bf16 index over the same embeddings is
# perlmutter_locale_sra4571_endwin0_minlen100_pca_d128_bf16.yaml.
#
# Expected size: ~1.1 B rows (half of the original 2.06 B plus ~3% end
# windows), ~3.2 TB fp32. Embed, merge, search:
#   CONFIG=configs/sra4571/perlmutter_locale_sra4571_endwin0_minlen100.yaml \
#     sbatch slurm_scripts/perlmutter_sra4571.sbatch
#   CONFIG=... INDEX_PATH=indexes/sra4571/locale@8vqiabk9-endwin0-minlen100 \
#     sbatch slurm_scripts/perlmutter_sra4571_merge.sbatch 32
#   sbatch slurm_scripts/perlmutter_sra4571_search.sbatch 0.00 \
#     configs/sra4571/perlmutter_locale_sra4571_endwin0_minlen100.yaml
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    end_window_min_tail_bp: 0
    min_seq_len: 100
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: locale@8vqiabk9-endwin0-minlen100
  index_label: exact
  search_label: top100

dataset_name: sra4571
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra4571/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra4571
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra4571
mutation_rate: 0.0
num_queries: 1000
