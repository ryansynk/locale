# Exact fp32 top-100 over the end-window + min_seq_len sra4571 index: the
# same protocol and k as its pca-d128-bf16/top100 run, so the two compare
# directly. Served from exact/top1000/hits/ without a rescan (find_cached_hits),
# so one GPU node for a minute per rate is enough:
#   srun --jobid <alloc> --overlap -N1 -n1 --gpus-per-node=4 uv run python \
#     scripts/run_benchmark.py --config <this file> --mutation_rate <rate>
# Results: results/sra4571/locale@8vqiabk9-endwin0-minlen100/exact/top100/
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    end_window_min_tail_bp: 0
    min_seq_len: 100
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: locale@8vqiabk9-endwin0-minlen100
  index_label: exact
  search_label: top100

dataset_name: sra4571
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra4571/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra4571
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra4571
mutation_rate: 0.0
num_queries: 1000
