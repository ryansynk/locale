# Metagraph k-mer baseline on sra4571 (the 4571-accession local bundle the
# LOCALE configs in this directory use). Runs inside the published container:
# add --image=ghcr.io/ratschlab/metagraph:master to salloc/sbatch. Metagraph
# canonicalises k-mers, so it already searches both strands; no flag needed.
#
# Single-node method: run_benchmark's multi-node build path shards accessions
# and merges DENSE indexes only, so launch this on one node with
# SLURM_NNODES=1 SLURM_NODEID=0 (as slurm_scripts/perlmutter_sra500_metagraph.sbatch
# does). 4571 accessions of contigs is a large single-node build; budget a
# long time limit and expect the index under indexes/sra4571/metagraph_k31/ to
# be well into the hundreds of GB. Results: results/sra4571/metagraph_k31/,
# beside the LOCALE experiment directories.
model:
  name: metagraph
  executable: shifter metagraph
  k: 31

# Same local bundle as perlmutter_locale_sra4571.yaml: dataset_name is not a
# run_benchmark.DATASETS key, so nothing is downloaded over the bundle.
# logan_accessions/ links the contigs (laid out by perlmutter_sra4571.sbatch).
dataset_name: sra4571
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra4571/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra4571
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra4571
mutation_rate: 0.0
num_queries: 1000
