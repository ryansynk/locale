# Metagraph k-mer baseline at k=31 on sra64viral-v2. Runs inside the published
# container: add --image=ghcr.io/ratschlab/metagraph:master to salloc/sbatch.
# Metagraph canonicalises k-mers, so it already searches both strands.
# Single-node method (--num_shards 1).
model:
  name: metagraph
  executable: shifter metagraph
  k: 31
  label: metagraph
  search_label: default

# Local bundle (locale-data, built 2026-11-09): 64 accessions (sra50 + 5 HBV
# genotype B + 5 genotype A + 4 genotype C), 500 raw-read queries from 10 HBV
# genotype-D runs (not indexed), each confirmed HBV against a 4-genome
# reference panel. Relevance is alignment-defined as in sra50/sra500 (minimap2
# identity > 0.9 against the indexed Logan contigs), so Rq varies per query
# and contig ids / intervals / strand are real. Per-rate query files
# queries_mut0.00/0.05/0.10.parquet. logan_accessions/ is a per-accession
# directory of symlinks into ../work/logan_contigs.
#
# The clean queries are the protocol: the divergence under test is the real
# genotype-D-vs-A/B/C difference (best-hit identity 0.90-1.00, median 0.95).
# The mut0.05 / mut0.10 files stack synthetic noise on top of it.
dataset_name: sra64viral-v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra64viral-v2/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra64viral
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra64viral
mutation_rate: 0.0
