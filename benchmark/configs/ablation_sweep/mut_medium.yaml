# Ablation table row "Training mutation: Medium" -- eval on sra50v2, Perlmutter.
#
# Checkpoint: wandb run 355y3fml (tomg-group-umd/rawbert), step 5859.
# Training recipe: identity 90/6/98; reference-genome data, hard negatives on, filter cutoff 0.7.
# The original table numbers came from benchmark/old/results_ablations/ on the
# sra50 v1 bundle; this re-scores the same checkpoint on the 2026-09 v2 rebuild.
#
# The configs in this directory differ ONLY in checkpoint_path, so the rows are
# comparable. Protocol: default top-k regroup at k=100 with both-strand
# querying, same as configs/sra50/perlmutter_locale_sra50v2.yaml. encoder_label
# names the run id, so every row gets its own results/ and indexes/ subtree.
#
# --mutation_rate (0.0 / 0.05 / 0.1) is the eval-noise axis; the value below is
# only the default. run_ablation_sweep.sh loops over all three.
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/355y3fml/checkpoint5859.pth.tar
    pooling: mean
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: locale@355y3fml
  index_label: exact
  search_label: top100

# Local bundle, see configs/sra50/perlmutter_locale_sra50v2.yaml.
dataset_name: sra50v2
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra50/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra50_ablation_sweep
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra50_ablation_sweep
mutation_rate: 0.0
