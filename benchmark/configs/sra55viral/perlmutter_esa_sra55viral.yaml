# Embed-Search-Align (dna2vec, "ESA") on sra55viral. Keeps pooling: max as in
# the published method (LOCALE uses mean). Same protocol as the LOCALE config:
# top-k regroup at k=100, both strands. Inherits both from DenseIndex.
model:
  encoder:
    name: dna2vec
    checkpoint_path: null
    pooling: max
    max_seq_len: 256
    chunk_overlap: 150
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: esa
  index_label: exact
  search_label: top100

# Local bundle (locale-data list-first pipeline, 2026-09): 55 accessions,
# 500 raw-read queries (Rq=5) drawn from 10 HBV genotype-D runs, per-rate
# query files queries_mut0.00/0.05/0.10.parquet. logan_accessions/ is created
# by run_sra55viral.sh (one directory per accession holding the .contigs.fa),
# downloaded from Logan on first use.
#
# Evaluated on the clean queries only (run_sra55viral.sh defaults to rate
# 0.00): the cross-genotype divergence is the point of this set, so the
# synthetic mut0.05 / mut0.10 files are not part of the protocol.
dataset_name: sra55viral
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra55viral/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra55viral
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra55viral
mutation_rate: 0.0
