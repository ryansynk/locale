# sra500-index variant of configs/sra64viral/perlmutter_metagraph_k31_sra64viral.yaml
# Metagraph k-mer baseline at k=31 on sra64viral-v2. Runs inside the published
# container: add --image=ghcr.io/ratschlab/metagraph:master to salloc/sbatch.
# Metagraph canonicalises k-mers, so it already searches both strands.
# Single-node method (--num_shards 1).
model:
  name: metagraph
  executable: shifter metagraph
  k: 31
  label: metagraph
  search_label: default


# The sra64viral-v2 queries searched against the EXISTING sra500 index (search
# only, nothing is built): index_dir is indexes/sra500 and the bundle's
# accs.txt is sra500's. scripts/merge_index_results.py unions these results
# with results/sra64viral (the same queries against the 64-run index), which
# is exactly a search over one index holding both sets: sra500 as distractors
# plus the 14 HBV runs. Run: INDEX=sra500 ./run_sra64viral.sh
dataset_name: sra64viral-v2-sra500idx
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra64viral-v2/bundle_sra500idx
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra64viral_sra500idx
mutation_rate: 0.0
