# sra500-index variant of configs/sra64viral/perlmutter_locale_l6e9itq9_w128_sra64viral.yaml
# LOCALE l6e9itq9/21380 (5-epoch Badread-fixed run, projection head) on
# sra64viral-v2 with the windowing of
# configs/sra500/perlmutter_locale_l6e9itq9_w128_sra500v2.yaml: 128 bp windows
# at stride 64, end window at tail > 30 bp. Exact top-100 regroup, both
# strands.
#
# Unlike the sra500 config there is no contig-length cutoff (min_seq_len):
# the HBV runs assemble into short fragments, and 31 of the 500 queries have
# relevant contigs only under 100 bp, which a 100 bp cutoff would remove from
# the index.
model:
  encoder:
    name: locale
    checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/l6e9itq9/checkpoint21380.pth.tar
    pooling: mean
    max_seq_len: 128
    chunk_overlap: 64
    end_window_min_tail_bp: 30
    min_seq_len: 100
    project: true
    batch_size: 1000
    device: cuda
    both_strands: true
  index:
    engine: exact
    top_k: 100
  encoder_label: locale@l6e9itq9-proj-w128s64-endwin30-minlen100
  index_label: exact
  search_label: top100


# The sra64viral-v2 queries searched against the EXISTING sra500 index (search
# only, nothing is built): index_dir is indexes/sra500 and the bundle's
# accs.txt is sra500's. scripts/merge_index_results.py unions these results
# with results/sra64viral (the same queries against the 64-run index), which
# is exactly a search over one index holding both sets: sra500 as distractors
# plus the 14 HBV runs. Run: INDEX=sra500 ./run_sra64viral.sh
dataset_name: sra64viral-v2-sra500idx
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra64viral-v2/bundle_sra500idx
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra64viral_sra500idx
mutation_rate: 0.0
