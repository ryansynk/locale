# Metagraph k=31 baseline searched with the sra500 negative queries.
#
# Calibrated-FPR experiment (see perlmutter_locale_8vqiabk9_sra500neg.yaml):
# the queries have no relevant accession, so their per-query max k-mer count
# gives metagraph's null distribution. Same index settings as
# configs/sra500/perlmutter_metagraph_sra500v2.yaml; index_dir is the sra500
# index dir, so the built indexes/sra500/metagraph/ (.done) is reused and
# nothing is rebuilt. Runs inside the published container on one CPU node:
#   sbatch slurm_scripts/perlmutter_sra500neg_metagraph.sbatch
model:
  name: metagraph
  executable: shifter metagraph
  k: 31
  label: metagraph
  search_label: default

dataset_name: sra500neg
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra500_negatives/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra500
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra500_negatives
mutation_rate: 0.0
