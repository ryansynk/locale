# Top-k-vectors-then-regroup variant of perlmutter_locale_sra4571.yaml.
#
# Identical encoder/index settings (same index_suffix, so it reads the merged
# index that perlmutter_sra4571.sbatch + perlmutter_sra4571_merge.sbatch built)
# but scores each query by its exact global top-1000 nearest index VECTORS
# regrouped to accessions by max score. This is the yardstick ranking (see
# memory: exact hits) and the one an ANN index accelerates.
#
# top_k / both_strands set experiment_id to ..._exacttop1000_bothstrands, so
# results land in results/sra4571/<experiment_id>_exacttop1000_bothstrands/ beside -- never over -- the
# full-dense baseline. Raw per-query top-1000 hits go to
# results/sra4571_topk_hits/ (config default topk_hits_dir), from which
# later runs at k <= 1000 are served without rescanning.
#
# Launch (this is perlmutter_sra4571_search.sbatch's default config):
#   sbatch slurm_scripts/perlmutter_sra4571_search.sbatch <rate>
model:
  name: locale
  checkpoint_path: /pscratch/sd/r/rsynk/locale/checkpoints/8vqiabk9/checkpoint5859.pth.tar
  batch_size: 1000
  device: cuda
  pooling: mean
  max_seq_len: 256
  chunk_overlap: 150
  # Since 2026-09-22 the top-k regroup is the default protocol, so
  # exact_search is a no-op; top_k: 1000 keeps this run's ranking (and its
  # _exacttop1000 experiment_id) identical to before.
  exact_search: true
  top_k: 1000
  # Query both strands, matching the sra50v2 / backbone-sweep protocol. Hits
  # are cached per strands setting, so this is the scan every later
  # both-strands run at k <= 1000 reuses; experiment_id gains _bothstrands.
  both_strands: true

dataset_name: sra4571
dataset_dir: /pscratch/sd/r/rsynk/locale-data/constructed/sra4571/bundle
index_dir: /pscratch/sd/r/rsynk/locale/benchmark/indexes/sra4571
results_dir: /pscratch/sd/r/rsynk/locale/benchmark/results/sra4571
mutation_rate: 0.0
num_queries: 1000
